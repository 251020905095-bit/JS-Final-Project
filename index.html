<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Accessible Photo Gallery</title>
    <style>
        #image {
            width: 100%;
            height: 350px;
            border: 3px solid #444;
            background-color: #e2e2e2;
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            text-align: center;
            line-height: 350px;
            font-size: 22px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }
        .preview {
            width: 140px;
            height: 90px;
            margin: 6px;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .preview:focus {
            outline: 3px solid #0056b3;
            border-color: #0056b3;
        }
    </style>
</head>
<body onload="addTabIndex()">

    <div id="image">
        Hover over an image below to display here.
    </div>

    <img class="preview" alt="Cảnh thiên nhiên núi rừng" src="https://picsum.photos/id/1015/600/400" 
    onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">

    <img class="preview" alt="Thành phố lung linh về đêm" src="https://picsum.photos/id/1016/600/400" 
    onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">

    <img class="preview" alt="Bờ biển xanh ngát hoàng hôn" src="https://picsum.photos/id/1018/600/400" 
    onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">

    <img class="preview" alt="Con đường mòn trong sương sớm" src="https://picsum.photos/id/1019/600/400" 
    onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">

    <img class="preview" alt="Đồi núi và hồ nước yên bình" src="https://picsum.photos/id/1020/600/400" 
    onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">

    <img class="preview" alt="Cây cầu cổ kính bắc qua sông" src="https://picsum.photos/id/1024/600/400" 
    onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">

    <script src="script.js"></script>
</body>
</html>
